*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--s0:#141414;--s1:#1e1e1e;--s2:#1a1a1a;--tx:#f1f5f9;--tx2:#94a3b8;--tx3:#64748b;--bd:#262626;--bds:#333}}
body{font-family:var(--font);background:var(--bg);color:var(--tx);max-width:430px;margin:0 auto;min-height:100dvh;overflow-x:hidden}
.safe{padding:calc(env(safe-area-inset-top,16px) + 12px) 16px calc(76px + env(safe-area-inset-bottom,12px)) 16px}
input,textarea,button{font-family:var(--font)}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--s2);border-top:.5px solid var(--bd);display:flex;padding:6px 0 env(safe-area-inset-bottom,6px);z-index:50}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;cursor:pointer;color:var(--tx3);font-size:10px;font-weight:500;transition:.2s}
.bnav-item.on{color:var(--acc)}
.bnav-item svg{width:22px;height:22px}
.card{background:var(--s2);border:.5px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.hero-card{background:linear-gradient(135deg,#059669,#10B981,#34d399);border-radius:20px;padding:24px 20px;margin-bottom:16px;color:white;position:relative;overflow:hidden}
.hero-card::after{content:'🏃';position:absolute;right:-10px;bottom:-20px;font-size:110px;opacity:.1}
.today{border:2px solid var(--acc);border-radius:16px;padding:16px;margin-bottom:16px;background:var(--s2);position:relative}
.today-badge{position:absolute;top:-10px;left:16px;background:var(--acc);color:white;font-size:10px;font-weight:700;padding:3px 12px;border-radius:8px;letter-spacing:.03em}
.wk-scroll{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;scrollbar-width:none}
.wk-scroll::-webkit-scrollbar{display:none}
.wk-pill{flex-shrink:0;padding:7px 15px;border-radius:20px;border:.5px solid var(--bd);background:var(--s2);font-size:12px;font-weight:500;cursor:pointer;color:var(--tx2);transition:.15s}
.wk-pill.on{background:var(--acc);border-color:var(--acc);color:white}
.wk-pill.done{border-color:#10B98160;color:var(--acc)}
.drow{padding:14px;border-radius:14px;border:.5px solid var(--bd);background:var(--s2);margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.drow:active{transform:scale(.98)}
.drow.done{opacity:.6}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--bds);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.chk.on{border:none}
.chk.rest{opacity:.25;border-style:dashed}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;opacity:0;transition:opacity .2s;display:none}
.overlay.show{display:block;opacity:1}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--s2);border-radius:24px 24px 0 0;max-height:90dvh;overflow-y:auto;z-index:101;transform:translateY(100%);transition:transform .3s ease-out;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:translateY(0)}
.zbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden}
.zbar div{flex:1;transition:.3s}
.log-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.log-field label{font-size:10px;color:var(--tx3);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em;font-weight:500}
.log-field input{width:100%;text-align:center;padding:10px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--s0);font-size:16px;font-weight:600;color:var(--tx);outline:none}
.log-field input:focus{border-color:var(--acc)}
.log-field input::placeholder{font-weight:400;font-size:13px;color:var(--tx3)}
.feel{display:flex;gap:8px;justify-content:center;margin:10px 0}
.feel-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--bd);background:var(--s0);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.feel-btn.on{border-color:var(--acc);transform:scale(1.15);box-shadow:0 0 0 3px var(--acc)30}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{padding:14px 6px;border-radius:14px;border:.5px solid var(--bd);background:var(--s2);text-align:center}
.badge.on{border:1.5px solid #F59E0B;background:#F59E0B08}
.badge.off{opacity:.3}
.badge .bi{font-size:26px;display:block;margin-bottom:3px}
.badge.off .bi{filter:grayscale(1)}
.pr-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pr-row::-webkit-scrollbar{display:none}
.pr-card{flex-shrink:0;width:120px;padding:14px 10px;border-radius:14px;border:.5px solid var(--bd);background:var(--s2);text-align:center}
.ck-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.ck-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--bds);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s}
.ck-box.on{background:var(--acc);border-color:var(--acc)}
.toast{position:fixed;top:env(safe-area-inset-top,16px);left:0;right:0;z-index:200;display:flex;justify-content:center;pointer-events:none;animation:slideD .4s ease-out}
.toast-inner{margin:0 16px;padding:14px 18px;background:var(--s2);border:2px solid #F59E0B;border-radius:16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);max-width:340px;width:100%}
@keyframes slideD{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>

function checkB(){const e=getEarned(),n=e.filter(x=>!prevB.includes(x));if(n.length)showToast(BADGES.find(b=>b.id===n[0]));prevB=e}
function getPR(){let bp=null,bd=0,bh=null,tr=0;Object.values(st.logs).forEach(l=>{if(l.pace){const p=l.pace.split(":").reduce((a,b,i)=>a+(i?+b:+b*60),0);if(!bp||p<bp)bp=p}if(l.distance&&+l.distance>bd)bd=+l.distance;if(l.avgHr&&(!bh||+l.avgHr<+bh))bh=l.avgHr;tr++});return{pace:bp?Math.floor(bp/60)+":"+(bp%60+"").padStart(2,"0"):"-",dist:bd||"-",hr:bh||"-",runs:tr}}
function estFinish(){const ls=Object.values(st.logs).filter(l=>l.pace);if(!ls.length)return"-";const ps=ls.map(l=>l.pace.split(":").reduce((a,b,i)=>a+(i?+b:+b*60),0));const av=ps.reduce((a,b)=>a+b,0)/ps.length;const t=av*21.1;return Math.floor(t/3600)+":"+((Math.floor((t%3600)/60))+"").padStart(2,"0")}

let h=`<div style="display:flex;justify-content:center;padding:12px 0 6px"><div style="width:40px;height:4px;border-radius:2px;background:var(--bds)"></div></div>`;
h+=`<div style="margin:0 16px 16px;padding:20px;border-radius:18px;background:${t.g};color:white;position:relative;overflow:hidden"><div style="position:absolute;right:-8px;bottom:-8px;font-size:64px;opacity:.12">${t.i}</div><div style="display:flex;justify-content:space-between"><div><div style="font-size:12px;opacity:.8">W${w} · ${DF[idx]}</div><div style="font-size:22px;font-weight:700;margin-top:4px">${t.l}</div></div><button onclick="closeSheet()" style="width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.25);cursor:pointer;font-size:16px;color:white;display:flex;align-items:center;justify-content:center">✕</button></div>${ses.km?`<div style="display:flex;gap:14px;margin-top:14px">${[["Jarak",ses.km+"km"],["Waktu",ses.time+"'"],["Pace",ses.pace],["Zone",ses.zone]].map(([l,v])=>`<div><div style="font-size:10px;opacity:.65">${l}</div><div style="font-size:15px;font-weight:600;margin-top:2px">${v}</div></div>`).join("")}</div>`:""}</div>`;
if(ses.zone&&ses.zone!=="-"){h+=`<div style="margin:0 16px 14px;padding:14px;background:var(--s2);border-radius:12px;border:.5px solid var(--bd)"><div style="font-size:11px;color:var(--tx3);margin-bottom:8px;font-weight:500">HR Zone</div><div class="zbar">${["Z1","Z2","Z3","Z4","Z5"].map(z=>`<div style="background:${ses.zone.includes(z)?ZD[z].c:"var(--s0)"};opacity:${ses.zone.includes(z)?1:.2}"></div>`).join("")}</div><div style="display:flex;justify-content:space-between;font-size:10px;margin-top:6px">${["Z1","Z2","Z3","Z4","Z5"].map(z=>`<span style="color:${ses.zone.includes(z)?ZD[z].c:"var(--tx3)"};font-weight:${ses.zone.includes(z)?600:400}">${z}</span>`).join("")}</div>${ses.zone.includes("Z2")?'<div style="margin-top:8px;font-size:13px">Target <b style="color:#34D399">119–139 bpm</b></div>':""}${ses.zone==="Z3"?'<div style="margin-top:8px;font-size:13px">Target <b style="color:#FBBF24">139–158 bpm</b></div>':""}</div>`}
h+=`<div style="margin:0 16px 14px;padding:14px;background:var(--s2);border-radius:12px;border:.5px solid var(--bd);font-size:14px;line-height:1.7">${ses.detail}</div>`;
if(pre.length){h+=`<div style="margin:0 16px 14px"><div style="font-size:11px;font-weight:600;color:var(--tx3);margin-bottom:6px">🔆 WARM-UP</div><div style="background:var(--s2);border-radius:12px;border:.5px solid var(--bd);overflow:hidden">${pre.map(([n,d],i)=>`<div style="padding:10px 14px;border-bottom:${i<pre.length-1?".5px solid var(--bd)":"none"};display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:500">${n}</span><span style="font-size:11px;color:${t.a};font-weight:500">${d}</span></div>`).join("")}</div></div>`}
if(ses.splits?.length){h+=`<div style="margin:0 16px 14px"><div style="font-size:11px;font-weight:600;color:var(--tx3);margin-bottom:6px">📍 KM BREAKDOWN</div><div style="background:var(--s2);border-radius:12px;border:.5px solid var(--bd);overflow:hidden">${ses.splits.map((sp,i)=>{const zc=(ZD[sp.z.replace(/[^Z\d]/g,"").substring(0,2)]||ZD.Z2).c;return`<div style="padding:10px 14px;border-bottom:${i<ses.splits.length-1?".5px solid var(--bd)":"none"}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px"><div style="display:flex;align-items:center;gap:6px"><div style="width:6px;height:6px;border-radius:50%;background:${zc}"></div><span style="font-size:12px;font-weight:600">KM ${sp.a}${sp.b>sp.a?"–"+sp.b:""}</span></div><div style="display:flex;gap:6px"><span style="font-size:10px;color:${zc};font-weight:500;padding:1px 5px;background:${zc}12;border-radius:5px">${sp.z}</span><span style="font-size:11px;color:var(--tx2)">${sp.p}/km</span></div></div><div style="font-size:11px;color:var(--tx2);padding-left:12px">${sp.inst}</div></div>`}).join("")}</div></div>`}
if(post.length){h+=`<div style="margin:0 16px 14px"><div style="font-size:11px;font-weight:600;color:var(--tx3);margin-bottom:6px">🧊 COOLDOWN</div><div style="background:var(--s2);border-radius:12px;border:.5px solid var(--bd);overflow:hidden">${post.map(([n,d],i)=>`<div style="padding:10px 14px;border-bottom:${i<post.length-1?".5px solid var(--bd)":"none"};display:flex;justify-content:space-between"><span style="font-size:12px;font-weight:500">${n}</span><span style="font-size:11px;color:var(--tx3)">${d}</span></div>`).join("")}</div></div>`}
if(ses.type!=="rest"&&ses.type!=="cross"){
h+=`<div style="margin:0 16px 14px"><div style="font-size:11px;font-weight:600;color:var(--tx3);margin-bottom:6px">📊 LOG HASIL LARI</div><div style="padding:14px;background:var(--s2);border-radius:12px;border:.5px solid var(--bd)"><div class="log-grid">${[["lp","⏱ Pace","6:30",log.pace],["la","❤️ Avg HR","132",log.avgHr],["lm","💓 Max HR","155",log.maxHr]].map(([id,l,ph,v])=>`<div class="log-field"><label>${l}</label><input id="${id}" type="text" placeholder="${ph}" value="${v||""}" ${id==="lp"?'inputmode="text"':'inputmode="numeric"'}></div>`).join("")}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">${[["ld","📏 Jarak km",ses.km+"",log.distance],["lt","⏰ Waktu mnt",ses.time+"",log.time]].map(([id,l,ph,v])=>`<div class="log-field"><label>${l}</label><input id="${id}" type="text" placeholder="${ph}" value="${v||""}" inputmode="decimal"></div>`).join("")}</div><div style="font-size:11px;color:var(--tx3);text-align:center">Bagaimana rasanya?</div><div class="feel">${["😵","😓","😐","😊","🤩"].map((e,i)=>`<button class="feel-btn ${feel===(i+1)?"on":""}" onclick="st.feel['${k}']=${i+1};save();openDay(${idx})">${e}</button>`).join("")}</div><button onclick="saveLog('${k}')" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--acc);background:var(--acc)08;color:var(--acc);font-size:13px;font-weight:600;cursor:pointer;margin-top:6px">💾 Simpan Log</button></div></div>`}
if(ses.km>=5){const ckK=k+"-ck";const cks=JSON.parse(localStorage.getItem(ckK)||"{}");const items=[["💧 Minum 500ml","w"],["🍌 Makan 2 jam sblm","f"],["📱 HR monitor","h"],["👟 Sepatu siap","s"]];if(ses.km>=10)items.push(["⚡ Gel dibawa","g"]);h+=`<div style="margin:0 16px 14px"><div style="font-size:11px;font-weight:600;color:var(--tx3);margin-bottom:6px">✅ CHECKLIST</div><div style="padding:8px 14px;background:var(--s2);border-radius:12px;border:.5px solid var(--bd)">${items.map(([l,id])=>`<div class="ck-row" onclick="toggleCk('${ckK}','${id}',this)"><div class="ck-box ${cks[id]?"on":""}">${cks[id]?'<svg width="10" height="10" viewBox="0 0 14 14"><path d="M3 7l3 3 5-5" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':""}</div><span style="font-size:13px">${l}</span></div>`).join("")}</div></div>`}
if(ses.type!=="rest"){h+=`<div style="padding:0 16px 32px"><button style="width:100%;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:600;cursor:pointer;background:${done?"var(--s0)":t.a};color:${done?"var(--tx2)":"white"}" onclick="toggleDone(${w},${idx});closeSheet()">${done?"Tandai belum selesai":"Selesai "+t.l+" ✓"}</button></div>`}
sh.innerHTML=h;requestAnimationFrame(()=>{document.getElementById("overlay").classList.add("show");sh.classList.add("show")})}

function closeSheet(){document.getElementById("overlay").classList.remove("show");document.getElementById("sheet").classList.remove("show");setTimeout(render,250)}
function saveLog(k){st.logs[k]={pace:document.getElementById("lp")?.value||"",avgHr:document.getElementById("la")?.value||"",maxHr:document.getElementById("lm")?.value||"",distance:document.getElementById("ld")?.value||"",time:document.getElementById("lt")?.value||"",ts:Date.now()};save();const b=event.target;b.textContent="✅ Tersimpan!";b.style.background="var(--acc)";b.style.color="white";setTimeout(()=>{b.textContent="💾 Simpan Log";b.style.background="var(--acc)08";b.style.color="var(--acc)"},1200)}
function toggleCk(ckK,id,el){const c=JSON.parse(localStorage.getItem(ckK)||"{}");c[id]=!c[id];localStorage.setItem(ckK,JSON.stringify(c));const b=el.querySelector(".ck-box");b.classList.toggle("on");b.innerHTML=c[id]?'<svg width="10" height="10" viewBox="0 0 14 14"><path d="M3 7l3 3 5-5" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':""}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script>
</body>
</html>
